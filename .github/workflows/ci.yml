name: test
# Unit + integration tests for the translation pipeline.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Commit message style
        if: github.event_name == 'pull_request'
        run: |
          set -e
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          failed=0
          for c in $(git rev-list --no-merges "$base"..HEAD); do
            echo "── checking $c ──"
            if ! git log -1 --format=%B "$c" | python3 tools/check_commit_msg.py --stdin; then
              failed=1
            fi
          done
          exit $failed
      - name: Generate digest fixtures
        run: python3 tools/make_digest.py 01
      - name: Run unit tests
        run: >
          python3 -m pytest tools/validate/tests/ tools/llm/tests/ -v
          --ignore=tools/validate/tests/integration
      - name: Run integration tests
        run: python3 -m pytest tools/validate/tests/integration/ -v
      - name: Lint
        run: ruff check tools/ --select E,F --ignore E501
      - name: Link check
        run: python3 tools/check_links.py
      - name: Content check
        run: python3 tools/check_content.py
      - name: Build pages
        run: python3 tools/build_pages.py
      - name: Check for committed bytecode
        run: |
          if git ls-files '**/__pycache__/*' | grep -q .; then
            echo "ERROR: .pyc files committed to git"
            git ls-files '**/__pycache__/*'
            exit 1
          fi
      - name: Verify retranslated chapters
        run: |
          if [ ! -f docs/.retranslate-pending ]; then
            echo "no retranslate-pending list — skipping"
            exit 0
          fi
          pending=$(grep -vE '^\s*(#|$)' docs/.retranslate-pending | tr -d ' ')
          failed=0
          for nn in $pending; do
            f=$(ls book/ru/${nn}-*.md 2>/dev/null | head -1)
            [ -z "$f" ] && continue
            if ! python3 tools/verify.py "$nn" --lang ru > /tmp/v_$nn.log 2>&1; then
              echo "ch.$nn FAILED:"; tail -5 /tmp/v_$nn.log; failed=1
            else
              echo "ch.$nn OK"
            fi
          done
          exit $failed

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Readability gate
        run: python3 tools/readability.py ru --strict
        continue-on-error: true
      - name: Bureaucratese gate
        run: python3 tools/bureaucratese.py ru --strict
        continue-on-error: true